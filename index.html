<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>İkra 💞</title>

<style>

body{
margin:0;
padding:0;
background:linear-gradient(#ff4d88,#ff99bb);
overflow:hidden;
font-family:Arial;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
color:white;
text-align:center;
}

.container{
width:90%;
max-width:400px;
background:rgba(255,255,255,0.15);
padding:25px;
border-radius:25px;
backdrop-filter:blur(10px);
animation:fade 1s;
}

@keyframes fade{
from{opacity:0;}
to{opacity:1;}
}

button{
padding:12px 20px;
border:none;
border-radius:20px;
font-size:18px;
background:white;
color:#ff4d88;
margin-top:20px;
font-weight:bold;
}

.heart{
position:absolute;
font-size:25px;
animation:fly 7s linear infinite;
}

@keyframes fly{
0%{
transform:translateY(100vh);
opacity:0;
}
100%{
transform:translateY(-120vh);
opacity:1;
}
}

</style>
</head>

<body>

<div class="heart" style="left:10%">💞</div>
<div class="heart" style="left:30%;animation-delay:2s;">💕</div>
<div class="heart" style="left:60%;animation-delay:1s;">💖</div>
<div class="heart" style="left:80%;animation-delay:4s;">💘</div>

<div class="container">

<h1>Ali’den İkra’ya 💌</h1>

<p id="text">

İkra… 💞<br><br>

Seninle konuşmak beklediğimden daha güzel geldi bana.<br><br>

Hot Wheels muhabbetlerimiz, random konuşmalarımız falan istemeden günümün parçası oldu 😭<br><br>

Bir de yeşil gözlerin var tabii…

</p>

<button onclick="nextText()">Devam Et 💌</button>

</div>

<script>

let step=0;

function nextText(){

step++;

if(step==1){

document.getElementById("text").innerHTML=`
Şu mobil oyun olayını sevmemem bile biraz kıskançlıktan galiba 😭<br><br>

Çünkü seni bazen herkesten biraz daha farklı görüyorum.<br><br>

İyi ki doğdun İkra 💞
`;

}

if(step==2){

document.getElementById("text").innerHTML=`
🧑‍⚕️ JACK’TEN MESAJ:<br><br>

“İkra, Ali’yi üzme 😭”<br><br>

“Adam sana düşmüş.”<br><br>

— Dr. Jack Shephard 💀
`;

}

}

</script>

</body>
</html>
